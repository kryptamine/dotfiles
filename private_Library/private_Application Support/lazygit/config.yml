gui:
  nerdFontsVersion: "3"
  border: "single"
  showBottomLine: false
  # Gruber Darker. Palette matches the Ghostty `gruber-darker` theme and
  # ~/.config/kitty/gruber-darker.conf, so lazygit sits on the same colors as
  # the terminal, Neovim, Herdr and tuicr.
  theme:
    activeBorderColor: ["#ffdd33", bold] # yellow
    # Panel titles are drawn in the border color, so this is the dim fg
    # rather than the darker #323232 border gray used elsewhere.
    inactiveBorderColor: ["#52494e"]
    searchingActiveBorderColor: ["#cc8c3c", bold] # brown
    optionsTextColor: ["#96a6c8"] # niagara
    selectedLineBgColor: ["#282828"] # bg+2
    inactiveViewSelectedLineBgColor: ["#181818"] # bg+1
    cherryPickedCommitFgColor: ["#000000"]
    cherryPickedCommitBgColor: ["#96a6c8"]
    markedBaseCommitFgColor: ["#000000"]
    markedBaseCommitBgColor: ["#ffdd33"]
    unstagedChangesColor: ["#f43841"] # red
    defaultFgColor: ["#e4e4e4"]
    # Without this lazygit hashes each author to an arbitrary truecolor.
    authorColors:
      "*": "#95a99f" # quartz
git:
  overrideGpg: true
  parseEmoji: true
  diffRenderers:
    - colorArg: always
      command: diff-so-fancy
quitOnTopLevelReturn: true
os:
  # Inside Neovim's terminal, open files in the parent Neovim instead of a
  # nested one.
  editPreset: "nvim-remote"
