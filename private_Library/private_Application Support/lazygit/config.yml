gui:
  nerdFontsVersion: "3"
  border: "single"
  showBottomLine: false
  # Copied from gruber-darker-renaissance extras/; copy it again after a palette change.
  theme:
    activeBorderColor: ["#fbde55", bold]
    # Panel titles take the border color, so this stays a readable gray
    inactiveBorderColor: ["#555555"]
    searchingActiveBorderColor: ["#a7bbe3", bold]
    optionsTextColor: ["#a7bbe3"]
    selectedLineBgColor: ["#1e1e1e"]
    inactiveViewSelectedLineBgColor: ["#181818"]
    cherryPickedCommitFgColor: ["#000000"]
    cherryPickedCommitBgColor: ["#a7bbe3"]
    markedBaseCommitFgColor: ["#000000"]
    markedBaseCommitBgColor: ["#fbde55"]
    unstagedChangesColor: ["#e74e4e"]
    defaultFgColor: ["#dcdcd6"]
    # Without this lazygit hashes each author to an arbitrary truecolor
    authorColors:
      "*": "#96a29c"
git:
  overrideGpg: true
  parseEmoji: true
  diffRenderers:
    - colorArg: always
      command: diff-so-fancy
quitOnTopLevelReturn: true
os:
  # Inside Neovim's terminal, open files in the parent Neovim instead of a
  # nested one.
  editPreset: "nvim-remote"
