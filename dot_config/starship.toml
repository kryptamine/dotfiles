"$schema" = 'https://starship.rs/config-schema.json'

# Avoid timeout warnings in large git repos
command_timeout = 1000

# The stock module set on one line
add_newline = false
# Colors from gruber-darker-renaissance, the same palette as ghostty and nvim
palette = "gruber"

[line_break]
disabled = true

[palettes.gruber]
fg = "#d2d2cc"
gray = "#8c8c8c"
yellow = "#efd45b"
green = "#8ac568"
red = "#d64c4b"
niagara = "#9fb2d6"
wisteria = "#9e95c7"
brown = "#cc8c3c"

[directory]
style = "niagara"
read_only = " 󰌾"
read_only_style = "red"

[git_branch]
format = "on [$symbol $branch(:$remote_branch)]($style) "
symbol = ""
style = "wisteria"

[git_state]
style = "brown"

# Only the branch: per-file counts aren't worth the prompt space
[git_status]
disabled = true

[cmd_duration]
disabled = true

[character]
success_symbol = "[❯](yellow)"
error_symbol = "[❯](red)"
vimcmd_symbol = "[❮](green)"

# Nerd Font icons: `starship preset nerd-font-symbols`, minus the sections above
# Toolchain and environment modules all get `style = "gray"`: the stock styles
# are bold and some are off-palette 256 colors (package 208, php 147, terraform 105)
