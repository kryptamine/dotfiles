onboarding = false

# Base "terminal" inherits the Ghostty ANSI palette (theme = kanso-zen),
# with exact Kanso Zen tokens layered on top for the Herdr UI.
[theme]
name = "terminal"

[theme.custom]
accent = "#7fb4ca"      # blue
panel_bg = "#090e13"    # zenBg0 — matches the Ghostty background
surface_dim = "#05080d" # one step below zenBg0 (Zen has no darker token)
surface0 = "#1c1e25"    # zenBg1
surface1 = "#22262d"    # zenBg2
overlay0 = "#393b44"    # zenBg3
overlay1 = "#5c6066"    # gray5
text = "#c5c9c7"        # fg
subtext0 = "#a4a7a4"    # gray2
red = "#e46876"         # red2
green = "#87a987"       # green2
yellow = "#e6c384"      # yellow2
blue = "#7fb4ca"        # blue
mauve = "#938aa9"       # violet
teal = "#7aa89f"        # green5
peach = "#b6927b"       # orange

[ui.toast]
delivery = "off"
