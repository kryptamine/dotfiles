onboarding = false

# Base "terminal" inherits the Ghostty ANSI palette (theme = gruber-darker),
# with exact Gruber Darker tokens layered on top for the Herdr UI.
[theme]
name = "terminal"

[theme.custom]
accent = "#ffdd33"      # yellow / palette 3
panel_bg = "#000000"    # matches the Ghostty `background` exactly
surface_dim = "#000000" # nothing darker than the background exists
# The "terminal" base leaves selection_bg = Reset, so the selected sidebar row
# would be invisible against the background; set row highlights explicitly.
active_row_bg = "#282828" # gruber bg+1 — focused workspace/agent row
selection_bg = "#453d41"  # gruber bg+2 — selected workspace row
surface0 = "#181818"    # gruber bg / palette 0
surface1 = "#282828"    # gruber bg+1
overlay0 = "#453d41"    # gruber bg+2
overlay1 = "#52494e"    # bright black / palette 8
text = "#e4e4e4"        # foreground / palette 7
subtext0 = "#95a99f"    # quartz / palette 6
red = "#f43841"         # palette 1
green = "#73d936"       # palette 2
yellow = "#ffdd33"      # palette 3
blue = "#96a6c8"        # niagara / palette 4
mauve = "#9e95c7"       # wisteria / palette 5
teal = "#95a99f"        # quartz / palette 6
peach = "#cc8c3c"       # brown (no ANSI slot)

[ui.toast]
delivery = "off"
